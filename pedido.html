<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Impresión DTF</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #003366;
            --accent-color: #ff6600;
            --light-gray: #f8f9fa;
            --dark-gray: #343a40;
            --white: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--light-gray);
            color: var(--dark-gray);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .main-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 20px;
        }

        .logo-container {
            max-width: 300px;
            margin: 0 auto 15px;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
        }

        .form-container {
            margin-bottom: 30px;
        }

        .form-section {
            margin-bottom: 30px;
            background-color: var(--light-gray);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="date"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .file-upload-container {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 4px;
            background-color: var(--white);
        }

        .file-upload-container:hover {
            border-color: var(--primary-color);
        }

        .file-list {
            margin-top: 15px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background-color: var(--white);
            border: 1px solid #eee;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .file-item button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .buttons {
            margin-top: 30px;
            text-align: center;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 150px;
        }

        #generateBtn {
            background-color: var(--primary-color);
            color: var(--white);
        }

        #sendBtn {
            background-color: #28a745;
            color: var(--white);
        }

        #printBtn {
            background-color: var(--accent-color);
            color: var(--white);
        }

        .secondary-btn {
            background-color: var(--white);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .status-message {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-header">
            <div class="logo-container">
                <img src="https://www.uniformesprofesionales.mx/assets/upfr/logoheader.png" 
                     alt="Uniformes Profesionales Logo" 
                     onerror="this.src='https://via.placeholder.com/300x100?text=Logo+Uniformes+Profesionales'">
            </div>
            <h1>SOLICITUD DE IMPRESIÓN DTF</h1>
        </div>
        
        <div class="form-container">
            <form id="requestForm">
                <div class="form-section">
                    <h3>INFORMACIÓN BÁSICA</h3>
                    
                    <div class="form-group">
                        <label for="asesor">Nombre del Asesor:</label>
                        <input type="text" id="asesor" name="asesor" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>INFORMACIÓN DEL CLIENTE</h3>
                    
                    <div class="form-group">
                        <label for="nombreCliente">Nombre Cliente:</label>
                        <input type="text" id="nombreCliente" name="nombreCliente" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="nombreDiseno">Nombre de Diseño:</label>
                        <input type="text" id="nombreDiseno" name="nombreDiseno" required>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>ARCHIVOS ADJUNTOS</h3>
                    
                    <div class="file-upload-container">
                        <label for="fileUpload" style="cursor: pointer;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-color);">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>Arrastra archivos aquí o haz clic para seleccionar</p>
                            <p><small>Formatos aceptados: .jpg, .png, .pdf, .ai, .psd (Máx. 5MB cada uno)</small></p>
                        </label>
                        <input type="file" id="fileUpload" multiple style="display: none;">
                    </div>
                    
                    <div class="file-list" id="fileList"></div>
                </div>
                
                <div class="form-section">
                    <h3>DETALLES ADICIONALES</h3>
                    
                    <div class="form-group">
                        <label for="notas">Notas:</label>
                        <textarea id="notas" name="notas" rows="4"></textarea>
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="button" id="sendBtn">
                        <span id="sendBtnText">Enviar Solicitud</span>
                    </button>
                    <button type="button" id="generateBtn">Generar PDF</button>
                    <button type="reset" class="secondary-btn">Limpiar</button>
                </div>
                
                <div id="statusMessage" class="status-message"></div>
            </form>
        </div>
    </div>

    <!-- Incluir EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script>
        // Inicializar EmailJS con tu User ID (Public Key)
        document.addEventListener('DOMContentLoaded', function() {
            emailjs.init('2KHnZovj2zxwhVlkU'); // 🔑 Reemplaza con tu User ID de EmailJS
            
            // Configurar fecha actual
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').value = today;
            
            // Variables para almacenar archivos
            let uploadedFiles = [];
            
            // Elementos del DOM
            const fileUpload = document.getElementById('fileUpload');
            const fileList = document.getElementById('fileList');
            const sendBtn = document.getElementById('sendBtn');
            const sendBtnText = document.getElementById('sendBtnText');
            const dropArea = document.querySelector('.file-upload-container');
            
            // Manejar selección de archivos
            fileUpload.addEventListener('change', function(e) {
                handleFiles(e.target.files);
            });
            
            // Manejar drag and drop
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, highlight, false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, unhighlight, false);
            });
            
            function highlight() {
                dropArea.style.borderColor = 'var(--primary-color)';
                dropArea.style.backgroundColor = 'rgba(0, 86, 179, 0.1)';
            }
            
            function unhighlight() {
                dropArea.style.borderColor = '#ccc';
                dropArea.style.backgroundColor = 'var(--white)';
            }
            
            dropArea.addEventListener('drop', function(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            });
            
            function handleFiles(files) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    
                    // Validar extensión del archivo
                    const fileExtension = file.name.split('.').pop().toLowerCase();
                    const validExtensions = ['jpg', 'jpeg', 'png', 'pdf', 'ai', 'psd'];
                    
                    if (!validExtensions.includes(fileExtension)) {
                        showStatusMessage(`Tipo de archivo no válido: .${fileExtension}`, 'error');
                        continue;
                    }
                    
                    // Validar tamaño (max 5MB)
                    if (file.size > 5 * 1024 * 1024) {
                        showStatusMessage(`Archivo demasiado grande (${formatFileSize(file.size)}): ${file.name}`, 'error');
                        continue;
                    }
                    
                    uploadedFiles.push(file);
                }
                updateFileList();
            }
            
            function updateFileList() {
                fileList.innerHTML = '';
                
                if (uploadedFiles.length === 0) {
                    fileList.innerHTML = '<p>No hay archivos seleccionados</p>';
                    return;
                }
                
                uploadedFiles.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const fileInfo = document.createElement('span');
                    fileInfo.textContent = `${file.name} (${formatFileSize(file.size)})`;
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.textContent = 'Eliminar';
                    removeBtn.onclick = () => removeFile(index);
                    
                    fileItem.appendChild(fileInfo);
                    fileItem.appendChild(removeBtn);
                    fileList.appendChild(fileItem);
                });
            }
            
            function removeFile(index) {
                uploadedFiles.splice(index, 1);
                updateFileList();
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // Enviar formulario por correo
            sendBtn.addEventListener('click', function() {
                if (!validateForm()) return;
                
                // Mostrar estado de carga
                sendBtn.disabled = true;
                sendBtnText.innerHTML = '<span class="loading"></span> Enviando...';
                
                // Crear objeto con los datos del formulario
                const formData = {
                    asesor: document.getElementById('asesor').value,
                    email: document.getElementById('email').value,
                    fecha: document.getElementById('fecha').value,
                    nombreCliente: document.getElementById('nombreCliente').value,
                    nombreDiseno: document.getElementById('nombreDiseno').value,
                    notas: document.getElementById('notas').value,
                    archivos: uploadedFiles.length > 0 ? 
                        uploadedFiles.map(f => f.name).join(', ') : 
                        'No se adjuntaron archivos'
                };
                
                sendEmail(formData);
            });
            
            function sendEmail(formData) {
                // Configura esto con tu Service ID y Template ID de EmailJS
                const serviceID = 'service_0pz5qxe';
                const templateID = 'template_st96eef';
                
                emailjs.send(serviceID, templateID, formData)
                    .then(function(response) {
                        showStatusMessage('✅ Solicitud enviada correctamente', 'success');
                        resetForm();
                    }, function(error) {
                        showStatusMessage(`❌ Error al enviar: ${error.text || 'Por favor intente más tarde'}`, 'error');
                    })
                    .finally(() => {
                        sendBtn.disabled = false;
                        sendBtnText.textContent = 'Enviar Solicitud';
                    });
            }
            
            function validateForm() {
                const requiredFields = ['asesor', 'email', 'fecha', 'nombreCliente', 'nombreDiseno'];
                let isValid = true;
                
                requiredFields.forEach(fieldId => {
                    const field = document.getElementById(fieldId);
                    if (!field.value.trim()) {
                        field.style.borderColor = 'red';
                        isValid = false;
                    } else {
                        field.style.borderColor = '#ced4da';
                    }
                });
                
                // Validar email
                const email = document.getElementById('email').value;
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById('email').style.borderColor = 'red';
                    showStatusMessage('Por favor ingrese un correo electrónico válido', 'error');
                    return false;
                }
                
                if (!isValid) {
                    showStatusMessage('Por favor complete todos los campos requeridos', 'error');
                }
                
                return isValid;
            }
            
            function showStatusMessage(message, type) {
                const statusElement = document.getElementById('statusMessage');
                statusElement.textContent = message;
                statusElement.className = 'status-message ' + type;
                statusElement.style.display = 'block';
                
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 5000);
            }
            
            function resetForm() {
                document.getElementById('requestForm').reset();
                uploadedFiles = [];
                updateFileList();
                document.getElementById('fecha').value = today;
            }
            
            // Generar PDF (funcionalidad básica)
            document.getElementById('generateBtn').addEventListener('click', function() {
                if (!validateForm()) return;
                showStatusMessage('📄 Función de generación de PDF en desarrollo', 'success');
            });
        });
    </script>
</body>
</html>
