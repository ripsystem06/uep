<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Impresión DTF</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #003366;
            --accent-color: #ff6600;
            --light-gray: #f8f9fa;
            --dark-gray: #343a40;
            --white: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            color: var(--dark-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .welcome-container {
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .logo-animation {
            max-width: 300px;
            margin: 0 auto;
            animation: floatUp 2s ease-out forwards;
            opacity: 0;
            transform: translateY(50px);
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-animation img {
            max-width: 100%;
            height: auto;
        }

        .welcome-title {
            color: var(--secondary-color);
            margin: 30px 0 10px;
            font-size: 28px;
            font-weight: 600;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        .welcome-subtitle {
            color: var(--primary-color);
            margin-bottom: 40px;
            font-size: 18px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeIn 1s ease-out 2s forwards;
        }

        .welcome-button {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-solicitud {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .btn-solicitud:hover {
            background-color: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-reporte {
            background-color: var(--accent-color);
            color: var(--white);
        }

        .btn-reporte:hover {
            opacity: 0.9;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .welcome-container {
                padding: 20px;
            }
            
            .logo-animation {
                max-width: 250px;
            }
            
            .welcome-title {
                font-size: 24px;
                margin: 20px 0 8px;
            }
            
            .welcome-subtitle {
                font-size: 16px;
                margin-bottom: 30px;
            }
            
            .button-container {
                flex-direction: column;
                gap: 15px;
                margin-top: 30px;
            }
            
            .welcome-button {
                width: 100%;
                padding: 12px 20px;
            }
        }

        @media (max-width: 480px) {
            .logo-animation {
                max-width: 200px;
            }
            
            .welcome-title {
                font-size: 22px;
            }
            
            .welcome-subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="logo-animation">
            <img src="https://www.uniformesprofesionales.mx/assets/upfr/logoheader.png" 
                 alt="Uniformes Profesionales Logo" 
                 onerror="this.src='https://via.placeholder.com/300x100?text=Logo+Uniformes+Profesionales'">
        </div>
        
        <h1 class="welcome-title">Sistema de Impresión DTF</h1>
        <p class="welcome-subtitle">Gestión profesional de pedidos y reportes</p>
        
        <div class="button-container">
            <a href="pedido.html" class="welcome-button btn-solicitud">Nueva Solicitud</a>
            <a href="indexfinal.html" class="welcome-button btn-reporte">Generar Reporte</a>
        </div>
    </div>

    <script>
        // Pequeña animación adicional para el hover de los botones
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.welcome-button');
            
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-3px)';
                    this.style.boxShadow = '0 5px 15px rgba(0, 0, 0, 0.1)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0)';
                    this.style.boxShadow = 'none';
                });
            });
        });
    </script>
</body>
</html>
